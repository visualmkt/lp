<script>
// ── CONFIG ──────────────────────────────────────────────────────────────────
const CONFIG_URL = 'https://cdn.jsdelivr.net/gh/visualmkt/lp@main/evidencia-letreiro/config.json';

async function loadConfig() {
  try {
    const r = await fetch(CONFIG_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (r.ok) return await r.json();
  } catch {}
  return (await fetch('./config.json')).json();
}

// ── TRACKING ────────────────────────────────────────────────────────────────

    document.body.insertBefore(ns, document.body.firstChild);
  }

  if (t.gtag) {
    const ids = Array.isArray(t.gtag) ? t.gtag : [t.gtag];
    const s = document.createElement('script');
    s.async = true; s.src = `https://www.googletagmanager.com/gtag/js?id=${ids[0]}`;

// ── HELPERS ─────────────────────────────────────────────────────────────────
const wa = (num, msg) =>
  `https://api.whatsapp.com/send?phone=${num}&text=${encodeURIComponent(msg)}`;

const waBtn = (num, msg, label, loc, cls) =>
  `<a href="${wa(num,msg)}" target="_blank" rel="noopener noreferrer"
     data-action="whatsapp" data-location="${loc}" class="${cls}">
    ${icon('whatsapp', 'mr-2 text-lg')}${label}
  </a>`;

// ── SECTIONS ─────────────────────────────────────────────────────────────────

function renderHeader(c) {
  const { whatsapp: num, whatsappMsgDefault: msg, phoneDisplay, phoneTel } = c.contact;
  const logoHtml = c.brand.logo
    ? `<img src="${c.brand.logo}" alt="${c.brand.logoAlt}" class="h-10 md:h-12 w-auto">`
    : `<span class="font-title font-semibold text-dark text-2xl">Gráfica Evidência</span>`;

  return `
  <header class="fixed top-0 w-full z-50 bg-white/95 backdrop-blur-sm border-b-2 border-brand shadow-sm">
    <div class="max-w-6xl mx-auto px-4 h-16 md:h-20 flex items-center justify-between gap-4">
      <a href="#" class="flex items-center gap-3 min-w-0">${logoHtml}</a>
      <div class="flex items-center gap-2 md:gap-4 shrink-0">
        <a href="tel:${phoneTel}" class="hidden md:flex items-center gap-2 text-slate-500 hover:text-brand transition-colors text-sm font-semibold font-body">
          ${icon('phone', 'text-brand text-xs')}${phoneDisplay}
        </a>
        ${waBtn(num, msg, 'Orçamento', 'header',
          'flex items-center bg-brand hover:bg-red-700 text-white font-body font-semibold text-sm px-4 py-2 md:px-5 md:py-2.5 rounded-full transition-all shadow-lg')}
      </div>
    </div>
  </header>`;
}

function renderHero(c) {
  const { whatsapp: num, whatsappMsgDefault: msg } = c.contact;
  const h = c.hero;
  const bg = h.bgImage
    ? `<img src="${h.bgImage}" alt="" class="absolute inset-0 w-full h-full object-cover" fetchpriority="high">
       <div class="absolute inset-0 bg-gradient-to-b from-dark/80 via-dark/70 to-dark/90"></div>`
    : `<div class="absolute inset-0 bg-dark"></div>
       <div class="hero-glow absolute inset-0"></div>
       <div class="absolute inset-0 opacity-5" style="background-image: repeating-linear-gradient(0deg, transparent, transparent 40px, #fff 40px, #fff 41px);"></div>`;

  return `
  <section class="relative min-h-screen flex items-center text-white pt-20 overflow-hidden bg-dark">
    ${bg}

    <div class="relative max-w-5xl mx-auto px-4 py-16 md:py-24 text-center">

      <!-- Badge -->
      <div class="inline-flex items-center gap-2 border border-brand/60 bg-brand/15 backdrop-blur-sm text-gold px-4 py-2 rounded-full text-sm font-body font-semibold mb-8">
        ${icon('ruler-combined', 'text-gold text-xs')}
        ${h.badge}
      </div>

      <!-- H1 -->

    const imgBlock = `

           style="background: ${p.imgStyle};">
        ${p.img
          ? `<img src="${p.img}" alt="${p.imgAlt}" class="w-full h-full object-cover" loading="lazy">`
          : `<div class="flex flex-col items-center justify-center text-white text-center p-10 absolute inset-0">
               ${icon(p.imgIcon.replace('fa-',''), 'text-7xl md:text-8xl opacity-30 mb-4')}

             </div>`

      <div class="flex flex-col justify-center">

        <h2 class="font-title font-semibold text-3xl md:text-4xl leading-snug tracking-tight text-dark mb-4">${p.title}</h2>

// ── EVENTS ───────────────────────────────────────────────────────────────────
function bindEvents() {
  document.querySelectorAll('[data-action="whatsapp"]').forEach(el => {
    el.addEventListener('click', () => {
      if (window.dataLayer) dataLayer.push({
        event: 'whatsapp_click',
        location: el.dataset.location || 'unknown'
      });
    });
  });

  let popupShown = false;
  document.addEventListener('mouseleave', e => {
    if (e.clientY < 20 && !popupShown && !sessionStorage.getItem('ep_shown')) {
      setTimeout(() => {
        const el = document.getElementById('exit-popup');
        if (el) { el.classList.remove('hidden'); popupShown = true; sessionStorage.setItem('ep_shown', '1'); }
        if (window.dataLayer) dataLayer.push({ event: 'exit_intent_show' });
      }, 300);
    }
  });

  document.querySelectorAll('#produtos img').forEach(img => {
    img.style.cursor = 'zoom-in';
    img.addEventListener('click', () => {
      document.getElementById('lb-img').src = img.src;
      document.getElementById('lightbox').classList.remove('hidden');
    });
  });

  document.querySelectorAll('a[href^="#"]').forEach(a => {
    a.addEventListener('click', e => {
      const t = document.querySelector(a.getAttribute('href'));
      if (t) { e.preventDefault(); t.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    });
  });
}

// ── MAIN ──────────────────────────────────────────────────────────────────────
(async () => {
  try {
    const c = await loadConfig();
    injectTracking(c.tracking);

    document.getElementById('app').innerHTML =
      renderHeader(c) +
      renderHero(c) +
      renderTrust(c) +
      renderProducts(c) +
      renderAuthority(c) +
      renderFaq(c) +
      renderCtaFinal(c) +
      renderFooter(c) +
      renderFloatingWA(c) +
      renderExitPopup(c);

    bindEvents();
  } catch (err) {
    document.getElementById('app').innerHTML = `

        <div>
          <p class="font-title text-3xl font-extrabold uppercase mb-2">Gráfica Evidência</p>
          <p class="text-slate-400 mb-6 text-sm">Ipixuna do Pará — PA</p>

             class="inline-flex items-center gap-2 bg-green-500 hover:bg-green-600 text-white px-8 py-4 rounded-2xl font-body font-semibold text-lg transition-all"

})();
