    details[open] .faq-chevron { transform: rotate(180deg); }

    .dashline { height: 1px; background: repeating-linear-gradient(90deg, currentColor 0 5px, transparent 0 10px); opacity: .2; }

    t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,

}

// ── HELPERS ─────────────────────────────────────────────────────────────────
const wa = (num, msg) =>
  `https://api.whatsapp.com/send?phone=${num}&text=${encodeURIComponent(msg)}`;

const waBtn = (num, msg, label, loc, cls) =>
  `<a href="${wa(num,msg)}" target="_blank" rel="noopener noreferrer"
     data-action="whatsapp" data-location="${loc}" class="${cls}">
    ${icon('whatsapp', 'mr-2 text-lg')}${label}
  </a>`;

// ── SECTIONS ─────────────────────────────────────────────────────────────────
const waLink = (c, msg, label, loc, cls) =>
  `<a href="${wa(c.contact.whatsapp, msg)}" target="_blank" rel="noopener noreferrer" data-action="whatsapp" data-location="${loc}" class="${cls}">${label}</a>`;

function renderHeader(c) {
  const { whatsappMsgDefault: msg, phoneDisplay, phoneTel } = c.contact;
  return `
  <header class="hd">
    <div class="w hd-in">
      <a href="#"><img src="${c.brand.logo}" alt="${c.brand.logoAlt}" class="hd-logo" fetchpriority="high"></a>
      <div class="hd-r">
        <a href="tel:${phoneTel}" class="hd-tel">${phoneDisplay}</a>
        ${waLink(c, msg, icon('whatsapp', '') + '&nbsp; WhatsApp', 'header', 'btn-wa btn-sm')}
      </div>
    </div>
  </header>`;
}

function renderHero(c) {
  const h = c.hero;
  const photo = h.bgImage ? `<img src="${h.bgImage}" alt="${h.bgAlt || ''}" class="hero-ph" fetchpriority="high">` : '';
  return `
  <section class="hero2">
    <div class="w ${photo ? 'hero-2col' : ''}">
      <div>
        <h1>${h.h1Pre} <span>${h.h1Highlight}</span></h1>
        <p class="sub">${h.subtitle}</p>
        <div class="row">
          ${waLink(c, c.contact.whatsappMsgDefault, icon('whatsapp', '') + '&nbsp; ' + h.ctaPrimary, 'hero', 'btn-wa')}
          ${(h.entries || []).map(e => `<a href="${e.href}" class="lnk">${e.label}</a>`).join('')}
        </div>
        <span class="sr-only">${h.hiddenSeo}</span>
      </div>
      ${photo}
    </div>
  </section>`;
}

function renderFacts(c) {
  if (!c.facts || !c.facts.length) return '';
  return `<div class="facts"><div class="w"><ul>${c.facts.map(f => `<li>${f}</li>`).join('')}</ul></div></div>`;
}

function renderSections(c) {
  return c.sections.map((sec, i) => {
    const rows = sec.items.map(it => `
      <div class="item ${it.img ? 'has-img' : ''}">
        ${it.img ? `<img src="${it.img}" alt="${it.imgAlt || ''}" loading="lazy">` : ''}
        <div><h3>${it.title}</h3><p>${it.desc}</p></div>
        ${waLink(c, it.msg, 'Pedir orçamento', 'card-' + sec.id, 'item-a')}
      </div>`).join('');
    return `
    <section id="${sec.id}" class="sec ${i % 2 ? 'alt' : ''}">
      <div class="w">
        <h2>${sec.title}</h2>
        <p class="intro">${sec.intro}</p>
        <div class="items">${rows}</div>
        <p class="sec-cta">${waLink(c, sec.msg, icon('whatsapp', '') + '&nbsp; ' + sec.cta, 'secao-' + sec.id, 'btn-wa')}</p>
      </div>
    </section>`;
  }).join('');
}

function renderGallery(c) {
  const g = c.gallery;
  if (!g || !g.images || !g.images.length) return '';
  return `
  <section id="galeria" class="sec">
    <div class="w">
      <h2>${g.title}</h2>
      <div class="gal">${g.images.map(im => `<img src="${im.src}" alt="${im.alt || ''}" loading="lazy">`).join('')}</div>
    </div>
  </section>`;
}

function renderSteps(c) {
  const st = c.steps;
  if (!st) return '';
  return `
  <section class="sec">
    <div class="w two">
      <div>
        <h2>${st.title}</h2>
        <ol class="steps">${st.items.map(it => `<li><strong>${it.title}.</strong> ${it.desc}</li>`).join('')}</ol>
      </div>
      <div>
        <h2>${c.authority.title}</h2>
        <ul class="plain">${c.authority.items.map(x => `<li>${x}</li>`).join('')}</ul>
      </div>
    </div>
  </section>`;
}

function renderFaq(c) {
  return `
  <section class="sec alt">
    <div class="w">
      <h2>Perguntas frequentes</h2>
      <div class="faq">${c.faq.map(f => `
        <details>
          <summary><span>${f.q}</span>${icon('chevron-down', 'faq-chevron')}</summary>
          <p>${f.a}</p>
        </details>`).join('')}</div>
    </div>
  </section>`;
}

function renderCtaFinal(c) {
  const ct = c.ctaFinal;
  const { whatsappMsgDefault: msg, phoneTel, phoneDisplay } = c.contact;
  return `
  <section class="fim">
    <div class="w">
      <h2>${ct.title}</h2>
      <p>${ct.subtitle}</p>
      <div class="row">
        ${waLink(c, msg, icon('whatsapp', '') + '&nbsp; ' + ct.cta, 'cta-final', 'btn-wa')}
        <a href="tel:${phoneTel}" class="lnk">ou ligue ${phoneDisplay}</a>
      </div>
    </div>
  </section>`;
}

function renderFooter(c) {
  const f = c.footer;
  const { phoneTel, phoneDisplay, whatsappMsgDefault: msg } = c.contact;
  return `
  <footer class="ft">
    <div class="w">
      <img src="${c.brand.logo}" alt="${c.brand.logoAlt}" class="hd-logo">
      <p><strong>${f.name}</strong><br>${f.address}</p>
      <p><a href="tel:${phoneTel}">${phoneDisplay}</a> · ${waLink(c, msg, 'WhatsApp', 'footer', '')}</p>
      <p class="ft-s">${f.copyright} · Site por <a href="https://visualmkt.com.br" target="_blank" rel="noopener">VisualMKT</a></p>
    </div>
  </footer>
  <noscript><p style="text-align:center;padding:20px;font-family:sans-serif;">${f.name} — ${f.address} — Tel: ${phoneDisplay}</p></noscript>`;
}

function renderFloatingWA(c) {
  return waLink(c, c.contact.whatsappMsgDefault, icon('whatsapp', ''), 'flutuante', 'wa-fab" aria-label="WhatsApp');
}

// ── EVENTS ───────────────────────────────────────────────────────────────────
function bindEvents() {
  document.querySelectorAll('[data-action="whatsapp"]').forEach(el => {
    el.addEventListener('click', () => {
      if (window.dataLayer) dataLayer.push({
        event: 'whatsapp_click',
        location: el.dataset.location || 'unknown'
      });
    });
  });

  document.querySelectorAll('#trofeus img, #homenagem img, #galeria img').forEach(img => {
    img.style.cursor = 'zoom-in';
    img.addEventListener('click', () => {
      document.getElementById('lb-img').src = img.src;
      document.getElementById('lightbox').classList.remove('hidden');
    });
  });

  document.querySelectorAll('a[href^="#"]').forEach(a => {
    a.addEventListener('click', e => {
      const t = document.querySelector(a.getAttribute('href'));
      if (t) { e.preventDefault(); t.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    });
  });
}

// ── MAIN ──────────────────────────────────────────────────────────────────────
(async () => {
  try {
    const c = await loadConfig();
    injectTracking(c.tracking);

    document.getElementById('app').innerHTML =
      renderHeader(c) + renderHero(c) + renderFacts(c) + renderSections(c) + renderGallery(c) +
      renderSteps(c) + renderFaq(c) + renderCtaFinal(c) + renderFooter(c) + renderFloatingWA(c);

    bindEvents();
  } catch (err) {
    document.getElementById('app').innerHTML = `
      <div class="min-h-screen flex items-center justify-center bg-dark text-white text-center p-8">
        <div>
          <p class="font-title text-3xl font-semibold mb-2">Junior Comunicação Visual</p>
          <p class="text-slate-400 mb-6 text-sm">Rio Claro — SP</p>
          <a href="https://api.whatsapp.com/send?phone=551935222566&text=Ol%C3%A1!%20Quero%20or%C3%A7amento%20de%20trof%C3%A9u%20%2F%20placa%20de%20homenagem."
             class="inline-flex items-center gap-2 bg-green-500 hover:bg-green-600 text-white px-8 py-4 rounded-2xl font-body font-semibold text-lg transition-all"
             target="_blank" rel="noopener noreferrer">
            ${icon('whatsapp', 'text-2xl')} Orçamento no WhatsApp
          </a>
        </div>
      </div>`;
  } finally {
    document.body.classList.add('ready');
  }
})();
</script>
