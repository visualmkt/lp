const CONFIG_URL = 'https://cdn.jsdelivr.net/gh/visualmkt/lp@main/junior-trofeus-homenagem/config.json';

async function loadConfig() {
  try {
    const r = await fetch(CONFIG_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (r.ok) return await r.json();
  } catch {}
  return (await fetch('./config.json')).json();
}

const wa = (num, msg) =>
  `https://api.whatsapp.com/send?phone=${num}&text=${encodeURIComponent(msg)}`;

const waBtn = (num, msg, label, loc, cls) =>
  `<a href="${wa(num,msg)}" target="_blank" rel="noopener noreferrer"
     data-action="whatsapp" data-location="${loc}" class="${cls}">
    ${icon('whatsapp', 'mr-2 text-lg')}${label}
  </a>`;

// ── SECTIONS ─────────────────────────────────────────────────────────────────

function renderHeader(c) {
  const { whatsapp: num, whatsappMsgDefault: msg, phoneDisplay, phoneTel } = c.contact;
  const logoHtml = c.brand.logo
    ? `<img src="${c.brand.logo}" alt="${c.brand.logoAlt}" class="h-9 md:h-11 w-auto" fetchpriority="high">`
    : `<span class="font-title font-semibold text-white text-2xl">Junior</span>`;

  return `
  <header class="fixed top-0 w-full z-50 bg-dark/95 backdrop-blur-sm border-b-2 border-brand shadow-xl">
    <div class="max-w-6xl mx-auto px-4 h-16 md:h-20 flex items-center justify-between gap-4">
      <a href="#" class="flex items-center gap-3 min-w-0">${logoHtml}</a>
      <div class="flex items-center gap-2 md:gap-4 shrink-0">
        <a href="tel:${phoneTel}" class="hidden md:flex items-center gap-2 text-white/70 hover:text-brand2 transition-colors text-sm font-semibold font-body">
          ${icon('phone', 'text-brand2 text-xs')}${phoneDisplay}
        </a>
        ${waBtn(num, msg, 'Orçamento', 'header',
          'flex items-center bg-brand hover:bg-orange-700 text-white font-body font-semibold text-sm px-4 py-2 md:px-5 md:py-2.5 rounded-full transition-all shadow-lg')}
      </div>
    </div>
  </header>`;
}

function renderHero(c) {
  const { whatsapp: num, whatsappMsgDefault: msg } = c.contact;
  const h = c.hero;
  const bg = h.bgImage
    ? `<img src="${h.bgImage}" alt="" class="absolute inset-0 w-full h-full object-cover" fetchpriority="high">
       <div class="absolute inset-0 bg-gradient-to-b from-dark/80 via-dark/70 to-dark/90"></div>`
    : `<div class="absolute inset-0 bg-dark"></div>
       <div class="hero-glow absolute inset-0"></div>
       <div class="absolute inset-0 opacity-5" style="background-image: repeating-linear-gradient(0deg, transparent, transparent 40px, #fff 40px, #fff 41px);"></div>`;

  return `
  <section class="relative min-h-screen flex items-center text-white pt-20 overflow-hidden bg-dark">
    ${bg}

    <div class="relative max-w-5xl mx-auto px-4 py-16 md:py-24 text-center">

      <!-- Badge -->
      <div class="inline-flex items-center gap-2 border border-brand/60 bg-brand/15 backdrop-blur-sm text-brand2 px-4 py-2 rounded-full text-sm font-body font-semibold mb-8">
        ${icon('trophy', 'text-brand2 text-xs')}
        ${h.badge}
      </div>

      <!-- H1 -->
      <h1 class="font-title font-bold text-4xl sm:text-5xl md:text-6xl lg:text-7xl leading-tight tracking-tight mb-6 drop-shadow-lg">
        ${h.h1Pre}<br><span class="text-brand2" style="text-shadow: 0 2px 20px rgba(0,0,0,.6)">${h.h1Highlight}</span>
      </h1>

      <!-- Subtitle -->
      <p class="text-slate-200 text-lg md:text-xl max-w-2xl mx-auto mb-8 font-body leading-relaxed drop-shadow">
        ${h.subtitle}
      </p>

      <!-- Seals row -->
      <div class="flex flex-wrap items-center justify-center gap-3 mb-10">
        <span class="tag-seal">${icon('trophy', '')}&nbsp;+29 anos de experiência</span>
        <span class="inline-flex items-center gap-1.5 text-white/80 text-xs font-body">
          ${icon('warehouse', 'text-brand2 text-xs')} Produção própria em Rio Claro
        </span>
        <span class="inline-flex items-center gap-1.5 text-white/80 text-xs font-body">
          ${icon('map-location-dot', 'text-brand2 text-xs')} Rio Claro e região
        </span>
      </div>

      <!-- CTAs -->
      <div class="flex flex-col sm:flex-row gap-4 justify-center">
        ${waBtn(num, msg, h.ctaPrimary, 'hero',
          'flex items-center justify-center bg-green-500 hover:bg-green-600 text-white font-body font-semibold text-lg px-10 py-4 md:py-5 rounded-2xl shadow-2xl transition-all hover:scale-105 wha-pulse')}
      </div>
      <div class="flex flex-col sm:flex-row gap-3 justify-center mt-4">
        ${(h.entries || []).map(e => `<a href="${e.href}"
           class="flex items-center justify-center border-2 border-white/40 backdrop-blur-sm text-white hover:bg-white/10 font-body font-semibold text-base px-8 py-3 rounded-2xl transition-all">
          ${icon('arrow-down', 'mr-2 text-sm')}${e.label}

      </div>

      <span class="sr-only">${h.hiddenSeo}</span>

    <div class="flex flex-col items-center text-center p-4 md:p-5">
      <div class="w-12 h-12 md:w-14 md:h-14 rounded-2xl flex items-center justify-center mb-3"
           style="background:rgba(232,82,14,.08);">
        ${icon(t.icon.replace('fa-',''), 'text-xl md:text-2xl text-brand')}
      </div>
      <p class="font-title font-semibold text-sm md:text-base tracking-tight leading-tight text-dark">${t.title}</p>
      <p class="text-slate-500 text-xs mt-0.5 font-body">${t.subtitle}</p>
    </div>`).join('');

  return `
  <section class="py-10 bg-white border-b border-slate-100">
    <div class="max-w-6xl mx-auto px-4">
      <div class="grid grid-cols-3 md:grid-cols-6 gap-1">${items}</div>
    </div>
  </section>`;
}

function renderSections(c) {
  return c.sections.map((sec, i) => {
    const bg = i % 2 === 0 ? 'bg-white' : 'bg-slate-50';
    const cards = sec.items.map(it => `
      <article class="card">
        <div class="card-img">${it.img
          ? `<img src="${it.img}" alt="${it.imgAlt || ''}" loading="lazy">`
          : icon('trophy', 'text-7xl opacity-30')}</div>
        <div class="card-body">
          <h3 class="font-title font-semibold text-xl text-dark leading-snug">${it.title}</h3>
          <p class="text-slate-600 font-body text-sm leading-relaxed">${it.desc}</p>
          <div style="margin-top:auto;padding-top:.75rem">${waBtn(c.contact.whatsapp, it.msg, 'Pedir orçamento', 'card-' + sec.id,
            'inline-flex items-center justify-center w-full bg-brand hover:bg-orange-700 text-white font-body font-semibold text-sm px-5 py-3 rounded-2xl transition-all')}</div>
        </div>
      </article>`).join('');
    return `
    <section id="${sec.id}" class="${bg} py-16 md:py-24">
      <div class="max-w-6xl mx-auto px-4">
        <div class="text-center mb-10 max-w-3xl mx-auto">
          <span class="text-brand font-title font-semibold text-xs uppercase tracking-[.15em]">${sec.kicker}</span>
          <h2 class="font-title font-semibold text-3xl md:text-4xl leading-snug tracking-tight text-dark mt-2 mb-4">${sec.title}</h2>
          <p class="text-slate-600 font-body leading-relaxed">${sec.intro}</p>
        </div>
        <div class="cards mb-10">${cards}</div>
        <div class="text-center">${waBtn(c.contact.whatsapp, sec.msg, sec.cta, 'secao-' + sec.id,
          'inline-flex items-center justify-center bg-green-500 hover:bg-green-600 text-white font-body font-semibold text-lg px-10 py-4 rounded-2xl shadow-lg transition-all hover:scale-105')}</div>
      </div>
    </section>`;
  }).join('');
}

function renderGallery(c) {
  const g = c.gallery;
  if (!g || !g.images || !g.images.length) return '';
  const imgs = g.images.map(im => `<img src="${im.src}" alt="${im.alt || ''}" loading="lazy">`).join('');
  return `
  <section id="galeria" class="bg-white py-16 md:py-24">
    <div class="max-w-6xl mx-auto px-4">
      <div class="text-center mb-10">
        <span class="text-brand font-title font-semibold text-xs uppercase tracking-[.15em]">${g.kicker}</span>
        <h2 class="font-title font-semibold text-3xl md:text-4xl leading-snug tracking-tight text-dark mt-2">${g.title}</h2>
      </div>
      <div class="gal">${imgs}</div>
    </div>
  </section>`;
}

function renderSteps(c) {
  const st = c.steps;
  if (!st) return '';
  const items = st.items.map((it, i) => `
    <div class="text-center p-4">
      <div class="step-n">${i + 1}</div>
      <h3 class="font-title font-semibold text-lg text-dark mb-1">${it.title}</h3>
      <p class="text-slate-600 font-body text-sm leading-relaxed">${it.desc}</p>
    </div>`).join('');
  return `
  <section class="bg-slate-50 py-16 md:py-24">
    <div class="max-w-5xl mx-auto px-4">
      <div class="text-center mb-10">
        <span class="text-brand font-title font-semibold text-xs uppercase tracking-[.15em]">${st.kicker}</span>
        <h2 class="font-title font-semibold text-3xl md:text-4xl leading-snug tracking-tight text-dark mt-2">${st.title}</h2>
      </div>
      <div class="cards">${items}</div>
    </div>
  </section>`;
}

function renderAuthority(c) {
  const a = c.authority;
  const items = a.items.map(item => `
    <li class="flex items-start gap-3 text-slate-300 font-body text-sm md:text-base">
      ${icon('circle-check', 'text-brand2 text-base mt-0.5 shrink-0')}${item}
    </li>`).join('');

  return `
  <section class="py-20 md:py-28 bg-dark text-white">
    <div class="max-w-6xl mx-auto px-4">
      <div class="grid md:grid-cols-2 gap-16 items-center">
        <div>
          <span class="text-brand2 font-title font-semibold text-xs uppercase tracking-[.15em]">${a.kicker}</span>
          <h2 class="font-title font-semibold text-3xl md:text-4xl leading-snug tracking-tight mt-3 mb-8">${a.title}</h2>
          <ul class="space-y-4">${items}</ul>
        </div>
        <div class="hidden md:block">
          <div class="rounded-3xl aspect-square overflow-hidden relative shadow-2xl">
            ${a.image
              ? `<img src="${a.image}" alt="${a.imageAlt || ''}" class="w-full h-full object-cover" loading="lazy">`
              : `<div class="w-full h-full flex items-center justify-center" style="background:linear-gradient(135deg,#3a3a3a,#1A1A1A)">${icon('trophy', 'text-white/10 text-[10rem]')}</div>`
            }
            <div class="absolute inset-0 bg-gradient-to-t from-dark/80 to-transparent pointer-events-none"></div>
            <div class="absolute bottom-6 left-6 right-6">
              <span class="tag-seal">${icon('trophy', '')}&nbsp;Produção própria</span>
              <p class="text-white/60 text-xs mt-3 font-body leading-tight">Troféus e placas feitos na nossa fábrica em Rio Claro.</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>`;
}

function renderFaq(c) {
  const items = c.faq.map((f, i) => `
    <details class="border border-slate-200 rounded-2xl overflow-hidden group bg-white" ${i===0?'open':''}>
      <summary class="flex items-center justify-between gap-4 p-5 md:p-6">
        <span class="font-body font-semibold text-base md:text-lg text-dark">${f.q}</span>
        ${icon('chevron-down', 'text-brand shrink-0 faq-chevron')}
      </summary>
      <div class="px-5 md:px-6 pb-5 md:pb-6 text-slate-600 font-body text-sm md:text-base leading-relaxed border-t border-slate-100 pt-4">
        ${f.a}
      </div>
    </details>`).join('');

  return `
  <section class="py-20 bg-slate-50">
    <div class="max-w-3xl mx-auto px-4">
      <div class="text-center mb-10">
        <span class="text-brand font-title font-semibold text-xs uppercase tracking-[.15em]">Tire suas dúvidas</span>
        <h2 class="font-title font-semibold text-3xl md:text-4xl leading-snug tracking-tight text-dark mt-2">Perguntas Frequentes</h2>
      </div>
      <div class="space-y-3">${items}</div>
    </div>
  </section>`;
}

function renderCtaFinal(c) {
  const ct = c.ctaFinal;
  const { whatsapp: num, whatsappMsgDefault: msg, phoneTel, phoneDisplay } = c.contact;
  return `
  <section class="py-20 md:py-28 bg-brand text-white text-center">
    <div class="max-w-3xl mx-auto px-4">
      <div class="tag-seal mx-auto w-fit mb-6">${icon('bolt', '')}&nbsp;Atendimento pelo WhatsApp</div>
      <h2 class="font-title font-semibold text-3xl md:text-5xl leading-snug tracking-tight mb-4">${ct.title}</h2>
      <p class="text-white/85 font-body text-lg mb-10 max-w-xl mx-auto leading-relaxed">${ct.subtitle}</p>
      <div class="flex flex-col sm:flex-row gap-4 justify-center">
        ${waBtn(num, msg, ct.cta, 'cta-final',
          'inline-flex items-center justify-center bg-white text-brand hover:bg-slate-50 font-body font-semibold text-lg px-10 py-4 md:py-5 rounded-2xl shadow-2xl transition-all hover:scale-105')}
        <a href="tel:${phoneTel}"
           class="inline-flex items-center justify-center border-2 border-white/40 text-white hover:bg-white/10 font-body font-semibold text-lg px-10 py-4 md:py-5 rounded-2xl transition-all">
          ${icon('phone', 'mr-2')}${phoneDisplay}

function renderFooter(c) {
  const f = c.footer;
  const { phoneTel, phoneDisplay, whatsapp: num, whatsappMsgDefault: msg } = c.contact;

    <div class="max-w-4xl mx-auto px-4 text-center">
      ${logoHtml}
      <p class="font-title font-semibold text-2xl tracking-tight mb-1">${f.name}</p>
      <p class="text-slate-400 text-sm font-body mb-1">${f.address}</p>
      <p class="text-slate-400 text-sm font-body mb-6">${f.tagline}</p>
      <div class="flex items-center justify-center gap-4 mb-8">
        <a href="tel:${phoneTel}" class="flex items-center gap-1.5 text-slate-400 hover:text-brand2 transition text-sm font-body">
          ${icon('phone', 'text-xs')}${phoneDisplay}
        </a>
        <span class="text-slate-700">|</span>
        <a href="${wa(num, msg)}" target="_blank" rel="noopener noreferrer"
           class="flex items-center gap-1.5 text-slate-400 hover:text-green-400 transition text-sm font-body"
           data-action="whatsapp" data-location="footer">
          ${icon('whatsapp', 'text-sm')}WhatsApp

      </div>
      <div class="dashline text-slate-700 mb-6"></div>
      <p class="text-slate-600 text-xs font-body">${f.copyright}</p>
      <p class="text-slate-700 text-xs mt-1 font-body">
        Desenvolvido por <a href="https://visualmkt.com.br" class="hover:text-brand2 transition" target="_blank" rel="noopener">VisualMKT</a>
      </p>
    </div>
  </footer>
  <noscript>
    <p style="text-align:center;padding:20px;font-family:sans-serif;">
      ${f.name} — ${f.address} — Tel: ${phoneDisplay}
    </p>
  </noscript>`;
}

function renderFloatingWA(c) {
  const { whatsapp: num, whatsappMsgDefault: msg } = c.contact;
  return `
  <a href="${wa(num, msg)}" target="_blank" rel="noopener noreferrer"
     data-action="whatsapp" data-location="flutuante"
     class="fixed bottom-5 right-5 z-50 flex items-center gap-3 bg-green-500 hover:bg-green-600 text-white font-body font-semibold py-3 px-5 rounded-full shadow-2xl wha-pulse transition-all hover:scale-105">
    ${icon('whatsapp', 'text-2xl')}
    <span class="hidden sm:inline text-sm">Orçamento</span>
  </a>`;
}

function renderExitPopup(c) {
  const { whatsapp: num } = c.contact;
  const msg = 'Olá! Quero orçamento de troféu / placa de homenagem.';
  return `
  <div id="exit-popup" class="hidden fixed inset-0 z-[998] bg-black/75 flex items-center justify-center p-4"
       onclick="if(event.target===this)this.classList.add('hidden')">
    <div class="bg-white rounded-3xl max-w-sm w-full p-8 text-center shadow-2xl relative">
      <button onclick="document.getElementById('exit-popup').classList.add('hidden')"
              class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-2xl leading-none transition">&times;</button>
      <span class="tag-seal mx-auto w-fit mb-5 block">${icon('bolt', '')}&nbsp;Orçamento</span>
      <h3 class="font-title font-semibold text-3xl text-dark leading-tight mb-3">Antes de ir...</h3>
      <p class="text-slate-500 font-body text-sm mb-6 leading-relaxed">
        Troféus e placas de homenagem com a sua marca. Peça o orçamento pelo WhatsApp.
      </p>
      ${waBtn(num, msg, 'Quero Orçamento Agora', 'popup-exit',
        'flex items-center justify-center w-full bg-brand hover:bg-orange-700 text-white font-body font-semibold px-8 py-4 rounded-2xl transition-all mb-3')}
      <button onclick="document.getElementById('exit-popup').classList.add('hidden')"
              class="text-slate-400 text-xs hover:text-slate-600 transition font-body">Não, obrigado</button>
    </div>
  </div>`;
}

// ── EVENTS ───────────────────────────────────────────────────────────────────
function bindEvents() {
  document.querySelectorAll('[data-action="whatsapp"]').forEach(el => {
    el.addEventListener('click', () => {
      if (window.dataLayer) dataLayer.push({
        event: 'whatsapp_click',
        location: el.dataset.location || 'unknown'
      });
    });
  });

  let popupShown = false;
  document.addEventListener('mouseleave', e => {
    if (e.clientY < 20 && !popupShown && !sessionStorage.getItem('ep_shown')) {
      setTimeout(() => {
        const el = document.getElementById('exit-popup');
        if (el) { el.classList.remove('hidden'); popupShown = true; sessionStorage.setItem('ep_shown', '1'); }
        if (window.dataLayer) dataLayer.push({ event: 'exit_intent_show' });
      }, 300);
    }
  });

  document.querySelectorAll('#trofeus img, #homenagem img, #galeria img').forEach(img => {
    img.style.cursor = 'zoom-in';
    img.addEventListener('click', () => {
      document.getElementById('lb-img').src = img.src;
      document.getElementById('lightbox').classList.remove('hidden');
    });
  });

  document.querySelectorAll('a[href^="#"]').forEach(a => {
    a.addEventListener('click', e => {
      const t = document.querySelector(a.getAttribute('href'));
      if (t) { e.preventDefault(); t.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    });
  });
}

// ── MAIN ──────────────────────────────────────────────────────────────────────
(async () => {
  try {
    const c = await loadConfig();
    injectTracking(c.tracking);

    document.getElementById('app').innerHTML =
      renderHeader(c) +
      renderHero(c) +
      renderTrust(c) +
      renderSections(c) +
      renderGallery(c) +
      renderSteps(c) +
      renderAuthority(c) +
      renderFaq(c) +
      renderCtaFinal(c) +
      renderFooter(c) +
      renderFloatingWA(c) +
      renderExitPopup(c);

    bindEvents();
  } catch (err) {
    document.getElementById('app').innerHTML = `
      <div class="min-h-screen flex items-center justify-center bg-dark text-white text-center p-8">
        <div>
          <p class="font-title text-3xl font-semibold mb-2">Junior Comunicação Visual</p>
          <p class="text-slate-400 mb-6 text-sm">Rio Claro — SP</p>
          <a href="https://api.whatsapp.com/send?phone=551935222566&text=Ol%C3%A1!%20Quero%20or%C3%A7amento%20de%20trof%C3%A9u%20%2F%20placa%20de%20homenagem."
             class="inline-flex items-center gap-2 bg-green-500 hover:bg-green-600 text-white px-8 py-4 rounded-2xl font-body font-semibold text-lg transition-all"
             target="_blank" rel="noopener noreferrer">
            ${icon('whatsapp', 'text-2xl')} Orçamento no WhatsApp
          </a>
        </div>
      </div>`;
  } finally {
    document.body.classList.add('ready');
  }
})();
</script>
