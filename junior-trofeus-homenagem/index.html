  <style>
    :root{--o:#E8520E;--o2:#EE7D00;--d:#141414;--ink:#1A1A1A;--paper:#F4F2EE;--mut:#5b5b5b;--line:#dedbd4;--r:4px}
    *,*:before,*:after{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
    body{margin:0;font-family:'Source Sans 3',system-ui,sans-serif;font-size:17px;line-height:1.6;color:var(--ink);background:var(--d);opacity:0;transition:opacity .3s;overflow-x:hidden}
    body.ready{opacity:1}
    h1,h2,h3,p,ul,ol,figure{margin:0}
    ul,ol{padding:0;list-style:none}
    a{color:inherit;text-decoration:none}
    img{display:block;max-width:100%}
    h1,h2,h3,.ttl{font-family:'Montserrat',system-ui,sans-serif;letter-spacing:-.02em}
    .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
    .w{max-width:1160px;margin:0 auto;padding:0 20px}
    .ic{display:inline-block;width:1em;height:1em;vertical-align:-.125em}

    #bar{position:fixed;top:0;left:0;right:0;height:3px;background:var(--o);transform:scaleX(0);transform-origin:0 50%;z-index:60}
    .hd{position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(20,20,20,.94);backdrop-filter:blur(6px);border-bottom:1px solid #2c2c2c}
    .hd-in{display:flex;align-items:center;justify-content:space-between;height:64px}
    .hd-logo{height:36px;width:auto}
    .hd-r{display:flex;align-items:center;gap:18px}
    .hd-tel{display:none;color:#cfcfcf;font-size:.92rem;font-weight:600}

    .btn{display:inline-flex;align-items:center;justify-content:center;gap:.55em;font-family:'Montserrat',sans-serif;font-weight:700;font-size:.95rem;padding:15px 24px;border-radius:var(--r);transition:transform .2s,background .2s,color .2s}
    .btn:active{transform:scale(.97)}
    .btn-wa{background:#1fa855;color:#fff}
    .btn-wa:hover{background:#178a45}
    .btn-o{background:var(--o);color:#fff}
    .btn-o:hover{background:#c9440a}
    .btn-w{background:#fff;color:var(--ink)}
    .btn-w:hover{background:var(--ink);color:#fff}
    .btn-sm{padding:10px 16px;font-size:.84rem}
    .btn-bl{width:100%}

    .hero{background:var(--d);color:#fff;padding:104px 0 0;position:relative;overflow:hidden}
    .hero-g{display:grid;gap:36px;align-items:center}
    .hero h1{font-weight:800;font-size:2.25rem;line-height:1.05}
    .hero h1 em{font-style:normal;color:var(--o2);background:linear-gradient(var(--o),var(--o)) 0 92%/100% .12em no-repeat;padding-bottom:.04em}
    .hero .sub{color:#cfcfcf;font-size:1.08rem;max-width:50ch;margin:20px 0 28px}
    .hero-cta{display:flex;flex-wrap:wrap;gap:12px}
    .hero-ph{position:relative;max-width:440px;margin:0 auto;width:100%}
    .hero-ph:before{content:"";position:absolute;inset:18px -14px -14px 18px;background:var(--o);border-radius:var(--r)}
    .hero-ph img{position:relative;width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:var(--r)}
    .hero-in>*{animation:up .6s cubic-bezier(.22,1,.36,1) both}
    .hero-in>*:nth-child(2){animation-delay:.1s}
    .hero-in>*:nth-child(3){animation-delay:.2s}
    .hero-ph{animation:up .7s .15s cubic-bezier(.22,1,.36,1) both}
    @keyframes up{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}

    .strip{margin-top:56px;border-top:1px solid #2c2c2c;border-bottom:1px solid #2c2c2c;overflow:hidden;padding:14px 0}
    .strip-in{display:flex;gap:40px;white-space:nowrap;font-family:'Montserrat',sans-serif;font-weight:800;font-size:2.4rem;line-height:1;text-transform:uppercase;color:transparent;-webkit-text-stroke:1px #555;will-change:transform}
    .strip-in b{color:var(--o);-webkit-text-stroke:0;font-weight:800}

    .paths{background:var(--d);padding:40px 0 64px}
    .paths p{color:#a9a9a9;font-size:.95rem;margin-bottom:14px}
    .paths-g{display:grid;gap:14px}
    .path{position:relative;display:block;border-radius:var(--r);overflow:hidden;aspect-ratio:16/10;color:#fff;background:#222}
    .path img{width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.22,1,.36,1)}
    .path:hover img{transform:scale(1.06)}
    .path:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.82))}
    .path span{position:absolute;left:18px;right:18px;bottom:16px;z-index:1;display:flex;justify-content:space-between;align-items:flex-end;font-family:'Montserrat',sans-serif;font-weight:700;font-size:1.3rem;line-height:1.15}
    .path i{font-style:normal;width:38px;height:38px;border-radius:50%;background:var(--o);display:flex;align-items:center;justify-content:center;flex:none;font-size:.9rem;transition:transform .3s}
    .path:hover i{transform:translateY(4px)}

    .facts{background:var(--o);color:#fff}
    .facts ul{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:22px 0;text-align:center}
    .facts strong{display:block;font-family:'Montserrat',sans-serif;font-weight:800;font-size:1.5rem;line-height:1.1}
    .facts li>span{font-size:.82rem;opacity:.92;line-height:1.25;display:block;margin-top:4px}

    .sec{padding:64px 0;background:#fff}
    .sec.pp{background:var(--paper)}
    .sec.dk{background:var(--d);color:#fff}
    .sec h2{font-weight:800;font-size:1.75rem;line-height:1.12;margin-bottom:12px}
    .lead{color:var(--mut);max-width:60ch;margin-bottom:30px}
    .dk .lead{color:#bdbdbd}
    .ans{font-size:1.12rem;max-width:68ch;color:#333}

    .grid3{display:grid;gap:18px}
    .card{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
    .dk .card{background:#1e1e1e;border-color:#303030}
    .card-ph{aspect-ratio:4/3;overflow:hidden;background:#222;position:relative}
    .card-ph img{width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.22,1,.36,1);cursor:zoom-in}
    .card:hover .card-ph img{transform:scale(1.05)}
    .card-bd{padding:20px;display:flex;flex-direction:column;gap:8px;flex:1}
    .card h3{font-weight:700;font-size:1.12rem;line-height:1.2}
    .card p{color:var(--mut);font-size:.97rem}
    .dk .card p{color:#bdbdbd}
    .card-bd .btn{margin-top:auto;align-self:flex-start}
    .card-bd .btn-bl{align-self:stretch}
    .card-bd>p:last-of-type{margin-bottom:14px}
    .sec-cta{margin-top:30px}

    .tier-ph{display:flex;align-items:center;justify-content:center;font-family:'Montserrat',sans-serif;font-weight:800;font-size:2rem;text-transform:uppercase;color:transparent;-webkit-text-stroke:1px #6a6a6a}
    .card p.tier-pr{font-family:'Montserrat',sans-serif;font-size:.9rem;color:var(--mut)}
    .tier-pr strong{display:block;font-size:1.7rem;font-weight:800;color:var(--ink);line-height:1.1}
    .tier.hl{border:2px solid var(--o)}

    .gal{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
    .gal figure{overflow:hidden;border-radius:var(--r);background:#222;aspect-ratio:1/1}
    .gal img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;transition:transform .6s cubic-bezier(.22,1,.36,1)}
    .gal figure:hover img{transform:scale(1.06)}

    .steps{position:relative;padding-left:44px;max-width:640px}
    .steps:before,.steps-fill{content:"";position:absolute;left:15px;top:8px;bottom:8px;width:2px;background:#d9d5cc}
    .steps-fill{background:var(--o);transform:scaleY(0);transform-origin:50% 0}
    .steps li{position:relative;padding-bottom:30px}
    .steps li:last-child{padding-bottom:0}
    .steps li:before{content:attr(data-n);position:absolute;left:-44px;top:0;width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;font-family:'Montserrat',sans-serif;font-weight:700;font-size:.9rem;display:flex;align-items:center;justify-content:center;z-index:1}
    .steps h3{font-size:1.1rem;font-weight:700}
    .steps p{color:var(--mut)}

    .about{display:grid;gap:32px;align-items:center}
    .about-ph{overflow:hidden;border-radius:var(--r);aspect-ratio:4/3}
    .about-ph img{width:100%;height:118%;object-fit:cover;will-change:transform}
    .about li{padding:12px 0 12px 22px;border-bottom:1px solid #303030;position:relative;color:#d6d6d6}
    .about li:before{content:"";position:absolute;left:0;top:1.25em;width:10px;height:2px;background:var(--o)}
    .big{font-family:'Montserrat',sans-serif;font-weight:800;font-size:4.2rem;line-height:1;color:var(--o2)}
    .big small{display:block;font-size:.95rem;font-weight:600;color:#bdbdbd;letter-spacing:0;margin-top:6px}

    .faq{max-width:780px;border-top:1px solid var(--line)}
    .faq details{border-bottom:1px solid var(--line)}
    .faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:16px;align-items:center;padding:18px 0;font-family:'Montserrat',sans-serif;font-weight:700;font-size:1rem}
    .faq summary::-webkit-details-marker{display:none}
    .faq summary .ic{color:var(--o);transition:transform .25s;flex:none}
    .faq details[open] summary .ic{transform:rotate(180deg)}
    .faq p{color:var(--mut);padding:0 0 20px;max-width:64ch}

    .fim{background:var(--o);color:#fff;padding:64px 0}
    .fim h2{font-weight:800;font-size:1.9rem;line-height:1.1;margin-bottom:10px;max-width:18ch}
    .fim p{max-width:52ch;margin-bottom:26px;opacity:.95}
    .fim .row{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center}
    .fim .tel{font-weight:600;text-decoration:underline;text-underline-offset:4px}

    .ft{background:#0e0e0e;color:#a3a3a3;padding:40px 0 96px;font-size:.92rem}
    .ft p{margin-top:14px}
    .ft strong{color:#fff}
    .ft a{text-decoration:underline;text-underline-offset:3px}
    .ft-s{font-size:.78rem;color:#6f6f6f}

    .fab{position:fixed;right:16px;bottom:16px;z-index:50;display:flex;align-items:center;gap:10px;background:#1fa855;color:#fff;font-family:'Montserrat',sans-serif;font-weight:700;font-size:.9rem;padding:14px 18px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.35);animation:pulse 2.4s 4s 2}
    .fab .ic{font-size:1.5rem}
    .fab span{display:none}
    @keyframes pulse{0%,100%{box-shadow:0 6px 20px rgba(0,0,0,.35),0 0 0 0 rgba(31,168,85,.5)}60%{box-shadow:0 6px 20px rgba(0,0,0,.35),0 0 0 16px rgba(31,168,85,0)}}

    .ov{position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:16px}
    .ov[hidden]{display:none}
    .ov img{max-width:92vw;max-height:90vh;border-radius:var(--r);object-fit:contain}
    .ov-x{position:absolute;top:10px;right:16px;color:#fff;font-size:2.6rem;line-height:1;background:none;border:0;cursor:pointer}
    .pop{background:#fff;border-radius:var(--r);max-width:380px;width:100%;padding:30px;position:relative;border-top:5px solid var(--o)}
    .pop h3{font-size:1.4rem;font-weight:800;margin-bottom:8px}
    .pop p{color:var(--mut);margin-bottom:20px}
    .pop .ov-x{color:#999;font-size:1.8rem;top:6px;right:12px}

    @media (prefers-reduced-motion:no-preference){
      .js.mo [data-rvl]{opacity:0;transform:translateY(28px)}
    }
    @media (prefers-reduced-motion:reduce){
      .hero-in>*,.hero-ph,.fab{animation:none}
      html{scroll-behavior:auto}
    }
    @media (min-width:640px){
      .paths-g{grid-template-columns:1fr 1fr}
      .grid3{grid-template-columns:repeat(2,1fr)}
      .gal{grid-template-columns:repeat(3,1fr)}
      .fab span{display:inline}
    }
    @media (min-width:900px){
      body{font-size:18px}
      .hd-tel{display:inline}
      .hero{padding-top:128px}
      .hero-g{grid-template-columns:1.15fr .85fr;gap:64px}
      .hero h1{font-size:3.9rem}
      .strip-in{font-size:4.4rem}
      .strip{margin-top:80px}
      .facts strong{font-size:2.3rem}
      .facts li>span{font-size:.95rem}
      .sec,.fim{padding:104px 0}
      .sec h2{font-size:2.6rem}
      .fim h2{font-size:3rem}
      .grid3{grid-template-columns:repeat(3,1fr);gap:22px}
      .gal{grid-template-columns:repeat(4,1fr);gap:14px}
      .about{grid-template-columns:1fr 1fr;gap:64px}
      .big{font-size:6.5rem}
      .how{display:grid;grid-template-columns:.8fr 1.2fr;gap:64px;align-items:start}
      .how h2{position:sticky;top:110px}
    }
  </style>

// ── HELPERS ─────────────────────────────────────────────────────────────────
let C;
const IMG = f => f ? (/^https?:/.test(f) ? f : C.imgBase + f) : '';
const wa = msg => `https://api.whatsapp.com/send?phone=${C.contact.whatsapp}&text=${encodeURIComponent(msg)}`;
const waA = (msg, label, loc, cls) =>
  `<a href="${wa(msg)}" target="_blank" rel="noopener noreferrer" data-action="whatsapp" data-location="${loc}" class="${cls}">${label}</a>`;
const waLabel = t => icon('whatsapp') + t;

// ── SECTIONS ────────────────────────────────────────────────────────────────
function renderHeader(c) {
  return `
  <header class="hd"><div class="w hd-in">
    <a href="#"><img src="${c.brand.logo}" alt="${c.brand.logoAlt}" class="hd-logo" fetchpriority="high"></a>
    <div class="hd-r">
      <a href="tel:${c.contact.phoneTel}" class="hd-tel">${c.contact.phoneDisplay}</a>
      ${waA(c.contact.whatsappMsgDefault, waLabel('WhatsApp'), 'header', 'btn btn-wa btn-sm')}
    </div>
  </div></header>`;
}

function renderHero(c) {
  const h = c.hero;
  return `
  <section class="hero">
    <div class="w hero-g">
      <div class="hero-in">
        <h1>${h.h1Pre} <em>${h.h1Highlight}</em> ${h.h1Pos}</h1>
        <p class="sub">${h.subtitle}</p>
        <div class="hero-cta">
          ${waA(c.contact.whatsappMsgDefault, waLabel(h.ctaPrimary), 'hero', 'btn btn-wa')}
          <a href="#faixas" class="btn btn-w">${h.ctaSecondary}</a>
        </div>
        <span class="sr-only">${h.hiddenSeo}</span>
      </div>
      ${h.image ? `<div class="hero-ph" id="hero-ph"><img src="${IMG(h.image)}" alt="${h.imageAlt}" fetchpriority="high" width="880" height="1100"></div>` : ''}
    </div>
    <div class="strip" aria-hidden="true"><div class="strip-in" id="strip">${h.strip.concat(h.strip).map((t, i) => i % 2 ? `<b>${t}</b>` : `<span>${t}</span>`).join('')}</div></div>
  </section>
  <section class="paths"><div class="w" data-rvl-group>
    <p data-rvl>${c.paths.label}</p>
    <div class="paths-g">${c.paths.items.map(p => `
      <a href="${p.href}" class="path" data-path="${p.id}" data-rvl>
        ${p.img ? `<img src="${IMG(p.img)}" alt="${p.alt}" loading="lazy">` : ''}
        <span>${p.label}<i>${icon('arrow-down')}</i></span>
      </a>`).join('')}</div>
  </div></section>`;
}

function renderFacts(c) {
  return `<div class="facts"><div class="w"><ul>${c.facts.map(f => `
    <li><strong>${f.count ? `<b data-count="${f.count}" data-prefix="${f.prefix || ''}">${f.prefix || ''}${f.count}</b>` : f.big}</strong><span>${f.label}</span></li>`).join('')}</ul></div></div>`;
}

function renderAnswer(c) {
  return `<section class="sec"><div class="w" data-rvl-group><p class="ans" data-rvl>${c.answer}</p></div></section>`;
}

function renderTiers(c) {
  const t = c.tiers;
  return `
  <section id="faixas" class="sec pp"><div class="w" data-rvl-group>
    <h2 data-rvl>${t.title}</h2>
    <p class="lead" data-rvl>${t.intro}</p>
    <div class="grid3">${t.items.map(it => `
      <article class="card tier ${it.highlight ? 'hl' : ''}" data-rvl>
        <div class="card-ph ${it.img ? '' : 'tier-ph'}">${it.img ? `<img src="${IMG(it.img)}" alt="${it.imgAlt || it.name}" loading="lazy" data-zoom>` : it.short}</div>
        <div class="card-bd">
          <h3>${it.name}</h3>
          ${it.desc ? `<p>${it.desc}</p>` : ''}
          <p class="tier-pr">${it.price ? `a partir de <strong>R$ ${it.price}</strong>` : t.noPrice}</p>
          ${waA(it.msg, waLabel(it.cta), 'faixa-' + it.id, 'btn btn-wa btn-bl')}
        </div>
      </article>`).join('')}</div>
  </div></section>`;
}

function renderSections(c) {
  return c.sections.map((sec, i) => `
    <section id="${sec.id}" class="sec ${i % 2 ? 'dk' : ''}"><div class="w" data-rvl-group>
      <h2 data-rvl>${sec.title}</h2>
      <p class="lead" data-rvl>${sec.intro}</p>
      <div class="grid3">${sec.items.map(it => `
        <article class="card" data-rvl>
          ${it.img ? `<div class="card-ph"><img src="${IMG(it.img)}" alt="${it.imgAlt}" loading="lazy" data-zoom></div>` : ''}
          <div class="card-bd">
            <h3>${it.title}</h3>
            <p>${it.desc}</p>
            ${waA(it.msg, 'Pedir orçamento', 'card-' + sec.id, 'btn btn-o btn-sm')}
          </div>
        </article>`).join('')}</div>
      <p class="sec-cta" data-rvl>${waA(sec.msg, waLabel(sec.cta), 'secao-' + sec.id, 'btn btn-wa')}</p>
    </div></section>`).join('');
}

function renderGallery(c) {
  const g = c.gallery;
  if (!g || !g.images || !g.images.length) return '';
  return `
  <section id="galeria" class="sec pp"><div class="w" data-rvl-group>
    <h2 data-rvl>${g.title}</h2>
    <p class="lead" data-rvl>${g.intro}</p>
    <div class="gal">${g.images.map(im => `<figure data-rvl><img src="${IMG(im.src)}" alt="${im.alt}" loading="lazy" data-zoom></figure>`).join('')}</div>
  </div></section>`;
}

function renderSteps(c) {
  const st = c.steps;
  return `
  <section class="sec"><div class="w how" data-rvl-group>
    <h2 data-rvl>${st.title}</h2>
    <ol class="steps" id="steps"><span class="steps-fill" id="steps-fill"></span>${st.items.map((it, i) => `
      <li data-n="${i + 1}" data-rvl><h3>${it.title}</h3><p>${it.desc}</p></li>`).join('')}</ol>
  </div></section>`;
}

function renderAbout(c) {
  const a = c.authority;
  return `
  <section class="sec dk"><div class="w about" data-rvl-group>
    <div>
      <p class="big" data-rvl><b data-count="${a.years}" data-prefix="+">+${a.years}</b><small>${a.yearsLabel}</small></p>
      <h2 data-rvl style="margin-top:26px">${a.title}</h2>
      <ul>${a.items.map(x => `<li data-rvl>${x}</li>`).join('')}</ul>
    </div>
    ${a.image ? `<div class="about-ph" data-rvl><img src="${IMG(a.image)}" alt="${a.imageAlt}" loading="lazy" id="about-img"></div>` : ''}
  </div></section>`;
}

function renderFaq(c) {
  return `
  <section class="sec pp"><div class="w" data-rvl-group>
    <h2 data-rvl>Perguntas frequentes</h2>
    <div class="faq" data-rvl>${c.faq.map((f, i) => `
      <details ${i === 0 ? 'open' : ''}><summary><span>${f.q}</span>${icon('chevron-down')}</summary><p>${f.a}</p></details>`).join('')}</div>
  </div></section>`;
}

function renderCtaFinal(c) {
  const ct = c.ctaFinal;
  return `
  <section class="fim"><div class="w" data-rvl-group>
    <h2 data-rvl>${ct.title}</h2>
    <p data-rvl>${ct.subtitle}</p>
    <div class="row" data-rvl>
      ${waA(c.contact.whatsappMsgDefault, waLabel(ct.cta), 'cta-final', 'btn btn-w')}
      <a href="tel:${c.contact.phoneTel}" class="tel">ou ligue ${c.contact.phoneDisplay}</a>
    </div>
  </div></section>`;
}

function renderFooter(c) {
  const f = c.footer;
  return `
  <footer class="ft"><div class="w">
    <img src="${c.brand.logo}" alt="${c.brand.logoAlt}" class="hd-logo" loading="lazy">
    <p><strong>${f.name}</strong><br>${f.address}</p>
    <p><a href="tel:${c.contact.phoneTel}">${c.contact.phoneDisplay}</a> · ${waA(c.contact.whatsappMsgDefault, 'WhatsApp', 'footer', '')}</p>
    <p class="ft-s">${f.copyright} · Desenvolvido por <a href="https://visualmkt.com.br" target="_blank" rel="noopener">VisualMKT</a></p>
  </div></footer>
  ${waA(c.contact.whatsappMsgDefault, icon('whatsapp') + '<span>Orçamento</span>', 'flutuante', 'fab')}
  <div id="exit-popup" class="ov" hidden>
    <div class="pop">
      <button class="ov-x" aria-label="Fechar">&times;</button>
      <h3>${c.exitPopup.title}</h3>
      <p>${c.exitPopup.subtitle}</p>
      ${waA(c.exitPopup.msg, waLabel(c.exitPopup.cta), 'popup-exit', 'btn btn-wa btn-bl')}
    </div>
  </div>`;
}

// ── EVENTS ──────────────────────────────────────────────────────────────────
function bindEvents() {
  const dl = o => { window.dataLayer = window.dataLayer || []; dataLayer.push(o); };
  document.querySelectorAll('[data-action="whatsapp"]').forEach(el =>
    el.addEventListener('click', () => dl({ event: 'whatsapp_click', location: el.dataset.location || 'unknown' })));
  document.querySelectorAll('[data-path]').forEach(el =>
    el.addEventListener('click', () => dl({ event: 'caminho_escolhido', caminho: el.dataset.path })));

  const lb = document.getElementById('lightbox');
  document.querySelectorAll('img[data-zoom]').forEach(img => img.addEventListener('click', () => {
    document.getElementById('lb-img').src = img.src; document.getElementById('lb-img').alt = img.alt; lb.hidden = false;
  }));
  document.querySelectorAll('.ov').forEach(o => o.addEventListener('click', e => {
    if (e.target === o || e.target.classList.contains('ov-x')) o.hidden = true;
  }));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('.ov').forEach(o => o.hidden = true); });

  document.addEventListener('mouseleave', e => {
    if (e.clientY < 20 && !sessionStorage.getItem('ep_shown')) {
      sessionStorage.setItem('ep_shown', '1');
      document.getElementById('exit-popup').hidden = false;
      dl({ event: 'exit_intent_show' });
    }
  });
}

// ── MOTION (uma lib só) ─────────────────────────────────────────────────────
function showAll() {
  document.documentElement.classList.remove('mo');
  document.querySelectorAll('[data-rvl]').forEach(el => { el.style.opacity = ''; el.style.transform = ''; });
}
function initMotion() {
  if (!window.Motion || matchMedia('(prefers-reduced-motion: reduce)').matches) return showAll();
  const { inView, animate, stagger, scroll } = Motion;
  try {
    document.querySelectorAll('[data-rvl-group]').forEach(sec => {
      const els = sec.querySelectorAll('[data-rvl]');
      inView(sec, () => {
        animate(els, { opacity: [0, 1], transform: ['translateY(28px)', 'translateY(0px)'] },
          { duration: 0.6, delay: stagger(0.07), ease: [0.22, 1, 0.36, 1] });
      }, { amount: 0.08 });
    });
    document.querySelectorAll('[data-count]').forEach(el => {
      inView(el, () => {
        const end = +el.dataset.count, pre = el.dataset.prefix || '';
        animate(0, end, { duration: 1.2, ease: 'easeOut', onUpdate: v => el.textContent = pre + Math.round(v) });
      });
    });
    const bar = document.getElementById('bar');
    scroll(p => { bar.style.transform = 'scaleX(' + p + ')'; });
    const strip = document.getElementById('strip');
    if (strip) scroll(p => { strip.style.transform = 'translateX(' + (-p * 38) + '%)'; }, { target: strip.parentElement, offset: ['start end', 'end start'] });
    const ph = document.getElementById('hero-ph');
    if (ph && innerWidth >= 900) scroll(p => { ph.style.transform = 'translateY(' + (p * 46) + 'px)'; }, { target: ph.closest('.hero'), offset: ['start start', 'end start'] });
    const ab = document.getElementById('about-img');
    if (ab) scroll(p => { ab.style.transform = 'translateY(' + (-p * 14) + '%)'; }, { target: ab.parentElement, offset: ['start end', 'end start'] });
    const fill = document.getElementById('steps-fill');
    if (fill) scroll(p => { fill.style.transform = 'scaleY(' + p + ')'; }, { target: document.getElementById('steps'), offset: ['start 75%', 'end 55%'] });
  } catch (e) { showAll(); }
}

// ── MAIN ────────────────────────────────────────────────────────────────────
(async () => {
  try {
    const c = C = await loadConfig();
    injectTracking(c.tracking);
    document.title = c.meta.title;
    document.getElementById('app').innerHTML =
      renderHeader(c) + renderHero(c) + renderFacts(c) + renderAnswer(c) + renderTiers(c) + renderSections(c) +
      renderGallery(c) + renderSteps(c) + renderAbout(c) + renderFaq(c) + renderCtaFinal(c) + renderFooter(c);
    bindEvents();
    document.documentElement.classList.add('mo');
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/motion@12.42.2/dist/motion.js';
    s.onload = initMotion; s.onerror = showAll;
    document.body.appendChild(s);
    setTimeout(() => { if (!window.Motion) showAll(); }, 3500);
  } catch (err) {
    document.getElementById('app').innerHTML = `
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;padding:32px">
        <div>
          <p class="ttl" style="font-size:1.6rem;font-weight:800;margin-bottom:6px">Junior Comunicação Visual</p>
          <p style="color:#a3a3a3;margin-bottom:22px">Troféus e placas de homenagem — Rio Claro, SP</p>
          <a class="btn btn-wa" target="_blank" rel="noopener noreferrer" data-action="whatsapp" data-location="erro"
             href="https://api.whatsapp.com/send?phone=551935222566&text=Ol%C3%A1!%20Quero%20or%C3%A7amento%20de%20trof%C3%A9u%20%2F%20placa%20de%20homenagem.">${icon('whatsapp')} Pedir orçamento no WhatsApp</a>
        </div>
      </div>`;
  } finally {
    document.body.classList.add('ready');
  }
})();
</script>
